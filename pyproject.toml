[tool.poetry]
name = "movie-streaming-api"
version = "0.1.0"
description = "Online Cinema Platform API built with FastAPI"
authors = ["Promt Busters"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.6"
uvicorn = {extras = ["standard"], version = "^0.34.0"}
pydantic = "^2.10.5"
pydantic-settings = "^2.7.0"
python-multipart = "^0.0.20"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.36"}
asyncpg = "^0.30.0"
aiosqlite = "^0.21.0"
alembic = "^1.14.0"
psycopg2-binary = "^2.9.10"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
bcrypt = "4.0.1"
email-validator = "^2.2.0"
redis = "^5.2.1"
celery = {extras = ["redis"], version = "^5.4.0"}
minio = "^7.2.14"
aioboto3 = "^13.4.0"
botocore = "^1.35.99"
pillow = "^11.1.0"
stripe = "^7.11.0"
aiosmtplib = "^4.0.0"
jinja2 = "^3.1.5"
httpx = "^0.28.1"
pandas = "^2.2.3"
tqdm = "^4.67.1"
beautifulsoup4 = "^4.12.3"
validators = "^0.34.0"
gunicorn = "^23.0.0"


[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"
pytest-asyncio = "^0.25.3"
pytest-cov = "^4.1.0"
pytest-env = "^1.1.5"
pytest-order = "^1.3.0"
black = "^24.1.1"
flake8 = "^7.1.1"
mypy = "^1.8.0"
isort = "^5.13.2"
types-redis = "^4.6.0"
types-passlib = "^1.7.7"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 79
target-version = ['py311']