<html lang="en">
<head>
  <title>Registration</title>
</head>
<body style="margin: 0; padding: 0; background-color: #000000; font-family: 'Arial Black', Arial, sans-serif;">
  <div style="border: 2px solid #ff0000; border-radius: 12px; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
              padding: 25px; max-width: 480px; margin: 40px auto; background-color: #ffffff; color: #000000;">
    <h2 style="color: #ff0000; text-align: center; margin: 0 0 20px; font-size: 26px; font-weight: bold; text-shadow: 2px 2px #000000;">
      Who You Gonna Call? PROMPT BUSTERS!
    </h2>
    <p style="margin: 10px 0; line-height: 1.6; font-size: 16px; color: #222222;">
      A registration request was made using your email:
      <strong id="email" style="color: #ff0000;">{{ email }}</strong>.
    </p>
    <p style="margin: 10px 0; line-height: 1.6; font-size: 16px; color: #222222;">
      To complete your registration, please activate your account by clicking the button below:
    </p>
    <p style="margin: 20px 0; text-align: center;">
      <a id="link" href="{{ activation_link }}" style="display: inline-block; background-color: #ff0000; color: #ffffff;
              text-decoration: none; font-size: 18px; font-weight: bold; padding: 12px 25px; border-radius: 6px;
              border: 2px solid #000000; text-shadow: 1px 1px #000000;">
       Activate Your Account
      </a>
    </p>
    <p style="margin: 10px 0; line-height: 1.6; font-size: 14px; color: #555555;">
      If this wasn't you, please ignore this email.
    </p>
    <p style="margin: 20px 0 10px; line-height: 1.6; font-size: 16px; color: #222222;">
      Regards,
    </p>
    <p style="margin: 0; font-style: italic; font-size: 16px; color: #ff0000; text-shadow: 1px 1px #000000;">
      Prompt Busters team.
    </p>
    <!-- Картинка Ghostbusters -->
    <p style="text-align: center; margin-top: 20px;">
      <img src="https://drive.google.com/uc?export=view&id=1hede9W2iAur86OypWicT162z__bulycK"
           alt="Ghostbusters style" style="max-width: 100%; height: auto; border-radius: 8px; border: 2px solid #ff0000;">
    </p>
  </div>
</body>
</html>
