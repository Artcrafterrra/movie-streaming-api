services:
  db:
    image: postgres:17
    container_name: postgres_theater
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_theater_data:/var/lib/postgresql/data/
    networks:
      - theater_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -h localhost || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_theater
    ports:
      - "3333:80"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - pgadmin_theater_data:/var/lib/pgadmin
    networks:
      - theater_network

  web:
    build: .
    container_name: backend_theater
    command: ["/bin/bash", "/commands/run_web_server_dev.sh"]
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres_theater
      LOG_LEVEL: debug
      PYTHONPATH: /usr/src/src
      WATCHFILES_FORCE_POLLING: "true"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./src:/usr/src/src
    networks:
      - theater_network

  migrator:
    build: .
    container_name: alembic_migrator_theater
    command: ["/bin/bash", "/commands/run_migration.sh"]
    env_file:
      - .env
    environment:
      PYTHONPATH: /usr/src/src
      POSTGRES_HOST: postgres_theater
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/usr/src/src
    networks:
      - theater_network

  mailhog:
    build:
      context: .
      dockerfile: ./docker/mailhog/Dockerfile
    container_name: mailhog_theater
    command: ["/bin/bash", "-c", "/commands/setup_mailhog_auth.sh && /go/bin/MailHog"]
    ports:
      - "8025:8025"
      - "1025:1025"
    env_file:
      - .env
    environment:
      MH_AUTH_FILE: /mailhog.auth
    networks:
      - theater_network

  minio:
    image: minio/minio:latest
    container_name: minio-theater
    command: server --console-address ":9001" /data
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file:
      - .env
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - theater_network

  minio_mc:
    build:
      context: .
      dockerfile: docker/minio_mc/Dockerfile
    container_name: minio_mc_theater
    command: ["/bin/sh", "-c", "/commands/setup_minio.sh"]
    env_file:
      - .env
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - theater_network

  redis:
    image: redis:7-alpine
    container_name: redis_theater
    ports:
      - "6379:6379"
    volumes:
      - redis_theater_data:/data
    networks:
      - theater_network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

  celery_worker:
    build: .
    container_name: celery_worker_theater
    command: celery -A src.celery_app worker --loglevel=info
    env_file:
      - .env
    environment:
      PYTHONPATH: /usr/src/src
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    volumes:
      - ./src:/usr/src/src
    networks:
      - theater_network
    restart: always
    user: "1000:1000"

  celery_beat:
    build: .
    container_name: celery_beat_theater
    command: celery -A src.celery_app beat --loglevel=info
    env_file:
      - .env
    environment:
      PYTHONPATH: /usr/src/src
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - theater_network
    restart: always

volumes:
  postgres_theater_data:
  pgadmin_theater_data:
  minio_data:
  redis_theater_data:

networks:
  theater_network:
    driver: bridge
