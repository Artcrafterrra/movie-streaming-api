name: CI Pipeline

on:
  pull_request:
    branches:
      - "develop"

jobs:
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest


    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install

      - name: Run isort
        run: |
          poetry run isort src --check-only

      - name: Run black
        run: |
          poetry run black src --check

      - name: Run flake8
        run: |
          poetry run flake8 src

      - name: Run mypy
        run: |
          poetry run mypy src
        continue-on-error: true

  tests:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install

      - name: Run all tests
        run: |
          if [ -d "src/tests" ]; then
            poetry run pytest src/tests/ -v || true
            echo "Tests execution completed"
          else
            echo "No tests directory found, skipping tests"
          fi