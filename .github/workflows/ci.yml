name: CI Pipeline

on:
  pull_request:
    branches:
      - "develop"

jobs:
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest


    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install

      - name: Run isort
        run: |
          poetry run isort src

      - name: Run black
        run: |
          poetry run black src

      - name: Run flake8
        run: |
          poetry run flake8 src

      - name: Run mypy
        run: |
          poetry run mypy src

  test-movies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install

      - name: Run movies tests
        run: |
          poetry run pytest src/tests/test_integration/test_movies.py
